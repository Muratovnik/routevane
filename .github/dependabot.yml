version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-toolchain:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-toolchain:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      desktop-toolchain:
        patterns:
          - '*'
