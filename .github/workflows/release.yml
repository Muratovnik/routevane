name: release

# Dispatch prepares the complete release and runs every native smoke before a
# stable tag exists. Tag publication consumes only the candidate recorded in that
# annotation. Candidate SBOM provenance retains its branch ref; promotion signs
# the final asset set under the stable tag without claiming a tagless build used it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to prepare (vX.Y.Z)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  EXPECTED_SHA: ${{ github.sha }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Bind the release identity and validate curated notes
        shell: pwsh
        run: |
          python tools/release_gate.py --candidate --version "$env:VERSION" --expected-sha "$env:EXPECTED_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'release identity check failed' }
          python .github/relkit.pyz notes "$env:VERSION" --output (Join-Path $env:RUNNER_TEMP 'release-notes.md')
          if ($LASTEXITCODE -ne 0) { throw 'curated release notes check failed' }
      - name: Audit public history and commit subjects
        shell: pwsh
        run: |
          # Owner policy reads a private sibling checkout and is completed by
          # the maintainer before pushing the tag. It cannot run on a clean CI checkout.
          python .github/relkit.pyz audit --history
          if ($LASTEXITCODE -ne 0) { throw 'public history audit failed' }
          python tools/check_commit_message.py --history
          if ($LASTEXITCODE -ne 0) { throw 'commit policy failed' }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web and browser dependencies
        shell: pwsh
        run: |
          Push-Location web
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          } finally {
            Pop-Location
          }
          ./tools/dev.ps1 setup-browser
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { throw 'desktop dependency install failed' }
      - name: Allow the pinned Chromium to create its sandbox
        run: python tools/ci_browser_sandbox.py
      - name: Run the canonical, race, and browser gates
        shell: pwsh
        run: |
          ./tools/dev.ps1 install-hooks
          ./tools/dev.ps1 check
          go test -race -shuffle=on ./...
          if ($LASTEXITCODE -ne 0) { throw 'race detector failed' }
          ./tools/dev.ps1 test-browser
      - name: Build and structurally verify every release archive
        shell: pwsh
        run: ./tools/dev.ps1 release -Version "$env:VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: .cache/release
          if-no-files-found: error
          retention-days: 1

  native-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-latest
            platform: windows-amd64
          - runner: windows-11-arm
            platform: windows-arm64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: .cache/release
      - name: Execute the native archive
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python tools/release_smoke.py --archive ".cache/release/routevane-$env:VERSION-$env:PLATFORM.zip" --version "$env:VERSION" --platform "$env:PLATFORM"
          if ($LASTEXITCODE -ne 0) { throw 'native launcher acceptance failed' }

  desktop:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --prefix web
          if ($LASTEXITCODE -ne 0) { throw 'web dependency install failed' }
          ./tools/dev.ps1 setup-desktop
      - name: Check shell and packaged desktop behavior
        shell: pwsh
        run: |
          ./tools/dev.ps1 check-desktop
          ./tools/dev.ps1 test-desktop
          ./tools/dev.ps1 test-update
      - name: Build the Windows installer and updater metadata
        shell: pwsh
        run: ./tools/dev.ps1 installer -Version "$env:VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-bundle
          path: .cache/desktop-release
          if-no-files-found: error
          retention-days: 1

  candidate:
    needs: [native-smoke, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: .cache/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-bundle
          path: .cache/desktop-release
      - name: Revalidate the publication identity and notes
        shell: pwsh
        run: |
          python tools/release_gate.py --candidate --version "$env:VERSION" --expected-sha "$env:EXPECTED_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'release identity check failed' }
          python .github/relkit.pyz notes "$env:VERSION" --output (Join-Path $env:RUNNER_TEMP 'release-notes.md')
          if ($LASTEXITCODE -ne 0) { throw 'curated release notes check failed' }
      - name: Revalidate transferred checksums
        shell: pwsh
        run: |
          foreach ($Bundle in @('release', 'desktop-release')) {
            $Manifest = if ($Bundle -eq 'release') { 'SHA256SUMS' } else { 'DESKTOP-SHA256SUMS' }
            $Lines = Get-Content -LiteralPath ".cache/$Bundle/$Manifest"
            foreach ($Line in $Lines) {
              if ($Line -notmatch '^([0-9a-f]{64})\s{2}(.+)$') { throw "invalid checksum line: $Line" }
              $Path = Join-Path ".cache/$Bundle" $Matches[2]
              $Actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($Actual -ne $Matches[1]) { throw "checksum mismatch: $($Matches[2])" }
            }
          }
      # The archive SBOM describes the Go/web archives alone, so it is attested
      # while the manifest still lists exactly those archives.
      - name: Attest the archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: .cache/release/SHA256SUMS
          sbom-path: .cache/release/SBOM.spdx.json
      - name: Publish one checksum manifest for every asset
        shell: pwsh
        run: |
          # A reader verifies one manifest, and the release carries one. The
          # desktop manifest only carried the bundle between jobs above.
          $Archives = @(Get-Content -LiteralPath '.cache/release/SHA256SUMS')
          $Desktop = @(Get-Content -LiteralPath '.cache/desktop-release/DESKTOP-SHA256SUMS')
          $Names = @($Archives + $Desktop | ForEach-Object { ($_ -split '\s{2}', 2)[1] })
          if ($Names.Count -ne ($Names | Sort-Object -Unique).Count) { throw 'duplicate checksum entry' }
          Set-Content -LiteralPath '.cache/release/SHA256SUMS' -Value ($Archives + $Desktop) -Encoding ascii
          Remove-Item -LiteralPath '.cache/desktop-release/DESKTOP-SHA256SUMS'
      - name: Assemble the exact candidate publication set
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path '.cache/candidate' -ErrorAction Stop | Out-Null
          Copy-Item -Path '.cache/release/*.zip' -Destination '.cache/candidate'
          Copy-Item -LiteralPath '.cache/release/SHA256SUMS' -Destination '.cache/candidate'
          Copy-Item -Path '.cache/desktop-release/*' -Destination '.cache/candidate'
          python .github/relkit.pyz release bundle $env:VERSION --assets .cache/candidate
          if ($LASTEXITCODE -ne 0) { throw 'candidate inventory validation failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: .cache/candidate
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve the exact candidate recorded in the tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_gate.py --version "$env:VERSION" --expected-sha "$env:EXPECTED_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'release identity check failed' }
          python .github/relkit.pyz release promote $env:VERSION --assets .cache/promoted
          if ($LASTEXITCODE -ne 0) { throw 'candidate promotion verification failed' }
          python .github/relkit.pyz notes $env:VERSION --output (Join-Path $env:RUNNER_TEMP 'release-notes.md')
          if ($LASTEXITCODE -ne 0) { throw 'curated release notes check failed' }
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .cache/promoted/*
      - name: Verify provenance and SBOM attestations before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Signer = "$env:GITHUB_REPOSITORY/.github/workflows/release.yml"
          $Archives = @(Get-ChildItem -LiteralPath '.cache/promoted' -Filter '*.zip' -File)
          foreach ($Archive in $Archives) {
            gh attestation verify $Archive.FullName --repo $env:GITHUB_REPOSITORY --signer-workflow $Signer --source-digest $env:EXPECTED_SHA --source-ref $env:GITHUB_REF
            if ($LASTEXITCODE -ne 0) { throw "provenance verification failed: $($Archive.Name)" }
            gh attestation verify $Archive.FullName --repo $env:GITHUB_REPOSITORY --signer-workflow $Signer --source-digest $env:EXPECTED_SHA --predicate-type 'https://spdx.dev/Document/v2.3'
            if ($LASTEXITCODE -ne 0) { throw "SBOM verification failed: $($Archive.Name)" }
          }
          gh attestation verify '.cache/promoted/SHA256SUMS' --repo $env:GITHUB_REPOSITORY --signer-workflow $Signer --source-digest $env:EXPECTED_SHA --source-ref $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0) { throw 'checksum provenance verification failed' }
          foreach ($Asset in Get-ChildItem -LiteralPath '.cache/promoted' -File | Where-Object { $_.Extension -ne '.zip' -and $_.Name -ne 'SHA256SUMS' }) {
            gh attestation verify $Asset.FullName --repo $env:GITHUB_REPOSITORY --signer-workflow $Signer --source-digest $env:EXPECTED_SHA --source-ref $env:GITHUB_REF
            if ($LASTEXITCODE -ne 0) { throw "desktop provenance verification failed: $($Asset.Name)" }
          }
      - name: Create a complete draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Assets = @(Get-ChildItem -LiteralPath '.cache/promoted' -File | Sort-Object Name | ForEach-Object FullName)
          gh release create $env:VERSION --verify-tag --draft --title $env:VERSION --notes-file (Join-Path $env:RUNNER_TEMP 'release-notes.md') @Assets
          if ($LASTEXITCODE -ne 0) { throw 'draft release creation failed' }
      - name: Verify uploaded asset digests and publish the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/relkit.pyz release draft $env:VERSION --assets .cache/promoted
          if ($LASTEXITCODE -ne 0) { throw 'draft verification failed' }
          gh release edit $env:VERSION --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'draft publication failed' }
          $Published = gh release view $env:VERSION --json isDraft,isImmutable,tagName | ConvertFrom-Json
          if ($Published.isDraft -or -not $Published.isImmutable) {
            throw 'published release is not immutable; enable release immutability before releasing'
          }
          # GitHub signs an immutable release after the draft is lifted, not
          # with it. Asking for the signature in the same second reported a
          # release that had in fact published as a failed one, so the check
          # waits for the attestation it verifies. A release that never
          # produces one still fails, and nothing here republishes.
          $Deadline = (Get-Date).AddMinutes(5)
          while ($true) {
            gh release verify $env:VERSION
            if ($LASTEXITCODE -eq 0) { break }
            if ((Get-Date) -ge $Deadline) { throw 'immutable release attestation verification failed' }
            Start-Sleep -Seconds 10
          }
