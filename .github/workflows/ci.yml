name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Audit public history and links
        # Owner policy reads a private sibling checkout and is a maintainer-only
        # pre-push gate. Public CI can and must validate the public history alone.
        run: python .github/relkit.pyz audit --history

  commit-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate commit subjects
        run: python tools/check_commit_message.py --history

  go:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          cache: true
      - name: Check Go surface
        shell: pwsh
        run: ./tools/dev.ps1 check-go
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -shuffle=on ./...

  web:
    runs-on: ubuntu-latest
    env:
      # The repository cache, the same location tools/dev.ps1 defaults to, so
      # the unit gate and the browser suites exercise one pinned revision.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/source tree/.cache/browsers
    defaults:
      run:
        working-directory: source tree/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source tree
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: source tree/.node-version
          cache: npm
          cache-dependency-path: source tree/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      # Unit component specs render in this browser, so `npm run check` needs
      # it. Playwright launches it with its own sandbox off, so the AppArmor
      # exception the browser job adds for the Go discovery tests is not needed.
      - name: Install Chromium
        run: npx --no-install playwright install chromium
      - name: Check web surface
        run: npm run check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium
        shell: pwsh
        run: ./tools/dev.ps1 setup-browser
      - name: Allow the pinned Chromium to create its sandbox
        run: python tools/ci_browser_sandbox.py
      # The browser tests drive the real binary, so this job builds it the same
      # way the local gate does rather than running the npm script alone.
      - name: Run browser and accessibility tests
        shell: pwsh
        run: ./tools/dev.ps1 test-browser
      # A browser failure is a rendering fact that only this environment has.
      # Without the run's own screenshots, snapshots and traces the evidence
      # dies with the runner and the next attempt starts from guesswork.
      - name: Keep the evidence a failed browser run produced
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence
          path: tmp/test-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --prefix web
          if ($LASTEXITCODE -ne 0) { throw 'web dependency install failed' }
          ./tools/dev.ps1 setup-desktop
      - name: Check shell and packaged desktop behavior
        shell: pwsh
        run: |
          ./tools/dev.ps1 check-desktop
          ./tools/dev.ps1 test-desktop
          ./tools/dev.ps1 test-update
