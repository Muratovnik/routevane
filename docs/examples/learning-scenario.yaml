# A repeatable exploration. Each step names the component every host observed
# during it is attributed to, which is what lets a media or voice dependency be
# accepted only after the corresponding action actually ran.
#
#   routevane learn --scenario docs/examples/learning-scenario.yaml
#   routevane learn --scenario docs/examples/learning-scenario.yaml --confirm
#
# Components come from the closed taxonomy: core, auth, media, voice, downloads,
# telemetry, advertising, third-party. Telemetry and advertising are recorded and
# never activated.
target: https://app.example.co.uk/
steps:
  - id: open
    component: core
    url: https://app.example.co.uk/
    settle_seconds: 3
  - id: sign-in
    component: auth
    url: https://app.example.co.uk/login
    settle_seconds: 3
  - id: play
    component: media
    url: https://app.example.co.uk/watch
    settle_seconds: 5
  - id: settle
    component: core
    settle_seconds: 3
