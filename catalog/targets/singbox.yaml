id: singbox
format_key: singbox-source-json-v1
title: sing-box
title_en: sing-box
kind: app
renderer: singbox-ruleset-json
constraints:
  supports_domain_exact: true
  supports_domain_suffix: true
  supports_dynamic_dns_set: false
  supports_ipv4: true
  supports_ipv6: true
  supports_prefixes: true
  max_rules: 8192
  max_artifact_size: 1048576
renderer_options: []
manual_installation_hint: Сохраните файл как локальный source rule-set и сошлитесь на него в записи rule_set с type local и format source.
manual_installation_hint_en: Save the file as a local source rule-set and reference it from a rule_set entry with type local and format source.
