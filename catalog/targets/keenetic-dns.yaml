id: keenetic-dns
format_key: keenetic-fqdn-group-v1
title: Keenetic (по доменам)
title_en: Keenetic (domain-based)
kind: router
renderer: keenetic-fqdn-group
constraints:
  supports_domain_exact: false
  supports_domain_suffix: true
  supports_dynamic_dns_set: true
  supports_ipv4: true
  supports_ipv6: true
  supports_prefixes: true
  max_rules: 38400
  max_artifact_size: 262144
  max_entries_per_list: 300
  max_lists: 128
renderer_options: []
manual_installation_steps:
  - "Нужна KeeneticOS 5.0 или новее. Откройте командную строку роутера и выполните команды из файла: они создают и обновляют группы имён этого формата."
  - "На странице «Маршрутизация — DNS-Based Routes» выберите интерфейс для каждой группы."
  - "Настройте клиентов так, чтобы DNS-сервером для них был роутер."
  - "Команды из файла ничего не удаляют: группу, которой больше нет в профиле, удалите на роутере сами или отправьте файл из Routevane, и отправка уберёт её."
manual_installation_steps_en:
  - "KeeneticOS 5.0 or newer is required. Open the router command line and run the commands from the file: they create and update the name groups of this format."
  - "On the Routing — DNS-Based Routes page choose the interface for each group."
  - "Make the router the DNS server of your clients."
  - "The commands never delete anything: remove a group that is no longer in the profile on the router yourself, or send the file from Routevane and the send removes it."
