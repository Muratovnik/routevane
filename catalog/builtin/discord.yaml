id: discord
title: Discord
components:
  web:
    required: true
seeds:
  - kind: domain_suffix
    value: discord.com
    component: web
    source: manual
sources:
  - id: itdoginfo
    type: http
    component: web
    config:
      url: https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Services/discord.lst
      format: text
      class: community
  - id: v2fly
    type: http
    component: web
    config:
      url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/discord
      format: domain-list
      class: community
  - id: iplist
    type: http
    component: web
    config:
      url: https://iplist.opencck.org/?format=text&data=cidr4&site=discord.com
      format: text
      class: community
  - id: iplist-2
    type: http
    component: web
    config:
      url: https://iplist.opencck.org/?format=text&data=cidr4&site=discord.gg
      format: text
      class: community
  - id: iplist-3
    type: http
    component: web
    config:
      url: https://iplist.opencck.org/?format=text&data=cidr4&site=discord.media
      format: text
      class: community
