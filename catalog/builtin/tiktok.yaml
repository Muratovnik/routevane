id: tiktok
title: TikTok
components:
  web:
    required: true
seeds:
  - kind: domain_suffix
    value: tiktok.com
    component: web
    source: manual
sources:
  - id: itdoginfo
    type: http
    component: web
    config:
      url: https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Services/tiktok.lst
      format: text
      class: community
  - id: v2fly
    type: http
    component: web
    config:
      url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/tiktok
      format: domain-list
      class: community
  - id: iplist
    type: http
    component: web
    config:
      url: https://iplist.opencck.org/?format=text&data=cidr4&site=tiktok.com
      format: text
      class: community
