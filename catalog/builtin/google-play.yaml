id: google-play
title: Google Play
components:
  web:
    required: true
seeds:
  - kind: domain_suffix
    value: play.google.com
    component: web
    source: manual
sources:
  - id: itdoginfo
    type: http
    component: web
    config:
      url: https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Services/google_play.lst
      format: text
      class: community
  - id: v2fly
    type: http
    component: web
    config:
      url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/google-play
      format: domain-list
      class: community
