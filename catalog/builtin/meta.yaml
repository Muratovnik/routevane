id: meta
title: Meta
components:
  web:
    required: true
seeds:
  - kind: domain_suffix
    value: facebook.com
    component: web
    source: manual
sources:
  - id: itdoginfo
    type: http
    component: web
    config:
      url: https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Services/meta.lst
      format: text
      class: community
  - id: v2fly
    type: http
    component: web
    config:
      url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/facebook
      format: domain-list
      class: community
  - id: iplist
    type: http
    component: web
    config:
      url: https://iplist.opencck.org/?format=text&data=cidr4&site=facebook.com
      format: text
      class: community
  - id: iplist-2
    type: http
    component: web
    config:
      url: https://iplist.opencck.org/?format=text&data=cidr4&site=instagram.com
      format: text
      class: community
