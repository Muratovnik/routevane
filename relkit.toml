[exposure]
private_paths = [
  ".agents/local",
  ".private",
  "docs/plans/private",
  ".impeccable",
  ".playwright-mcp",
]
private_files = [
  ".claude/settings.local.json",
  ".codex/workflow.toml",
  "AGENTS.local.md",
]
private_suffixes = [".local.md", ".override.md"]
required_ignores = [
  ".agents/local/private.md",
  ".claude/settings.local.json",
  ".codex/workflow.toml",
  ".env",
  ".env.production",
  ".private/manifest.json",
  "AGENTS.local.md",
  "docs/plans/private/note.md",
  ".impeccable/state.json",
  ".playwright-mcp/report.md",
  "private.key",
]
# The configured dependency updater publishes branches signed by GitHub.
allowed_identities = [
  "Nikolai Muratov <el.muratovnik@gmail.com>",
  "dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>",
  "GitHub <noreply@github.com>",
]
allowed_users = ["...", "name"]
forbid_ai_attribution = true
forbid_internal_planning = true
forbid_machine_observations = true
betterleaks_config = ".betterleaks.toml"

[changelog]
profile = "conventional-changelog"
first_version = "0.1.0"

[release]
repository = "Muratovnik/routevane"
remote = "origin"
workflow = ".github/workflows/release.yml"
required_jobs = ["publish"]
candidate_jobs = ["build", "native-smoke (ubuntu-24.04, linux-amd64)", "native-smoke (ubuntu-24.04-arm, linux-arm64)", "native-smoke (windows-latest, windows-amd64)", "native-smoke (windows-11-arm, windows-arm64)", "native-smoke (macos-15, darwin-arm64)", "desktop", "candidate"]
# The first numbered changelog entry is the prepared version. The tag remains
# the binary's version source; there is no second product version file to sync.
version_file = "CHANGELOG.md"
version_pattern = '\A[\s\S]*?^## \[([0-9]+\.[0-9]+\.[0-9]+)\]'
changelog = "CHANGELOG.md"
# The Windows desktop installer, its differential blockmap and the updater feed
# ship in the same release. electron-builder names them without the tag's `v`.
assets = [
  "routevane-{tag}-darwin-arm64.zip",
  "routevane-{tag}-linux-amd64.zip",
  "routevane-{tag}-linux-arm64.zip",
  "routevane-{tag}-windows-amd64.zip",
  "routevane-{tag}-windows-arm64.zip",
  "Routevane-{version}-x64-setup.exe",
  "Routevane-{version}-x64-setup.exe.blockmap",
  "latest.yml",
  "SHA256SUMS",
]
checksum_file = "SHA256SUMS"
checks = [
  ["pwsh", "-NoLogo", "-NoProfile", "-File", "tools/dev.ps1", "check"],
  ["pwsh", "-NoLogo", "-NoProfile", "-File", "tools/dev.ps1", "test-browser"],
]
smoke = [["{python}", "tools/release_smoke.py", "--assets", "{assets}", "--version", "{tag}", "--temp-dir", "{temp}"]]
smoke_platforms = ["linux", "darwin", "win32"]
timeout = 3600
command_timeout = 1800
require_guard = true
owner_audit = true
# Only the new tag is pushed. Push a reviewed source branch separately if wanted.
