# Changelog template. See docs/releasing.md for the pinned command and review policy.

[changelog]
header = ""
body = """
{% if version -%}
{% if previous.version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/Muratovnik/routevane/compare/{{ previous.version }}...{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/Muratovnik/routevane/releases/tag/{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% endif -%}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/Muratovnik/routevane/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { breaking = true, group = "<!-- 0 -->BREAKING CHANGES" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance Improvements" },
  { message = "^revert", group = "<!-- 4 -->Reverts" },
  { message = ".*", skip = true },
]
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
